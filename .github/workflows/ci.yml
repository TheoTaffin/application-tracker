name: CI

on:
  push:
    branches: [main] # feature branches are covered by pull_request
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make deps-js
      - run: make test

  # Real Postgres + S3 storage via the dev stack (`make dev`).
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make deps-js
      - run: make env
      - run: make test-integration

  # Builds the production images and checks the whole stack becomes healthy.
  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make env
      - run: make up
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/api/health
      - if: failure()
        run: docker compose logs

  # --- Continuous deployment: pushes to main, once every job above has passed ---------

  # Native arm64 runner: the images run on a Raspberry Pi (no slow QEMU emulation).
  publish:
    needs: [unit-tests, integration-tests, docker-stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runner
            image: ghcr.io/theotaffin/application-tracker
          - target: init
            image: ghcr.io/theotaffin/application-tracker-init
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          # Links the package to this repository (and its GITHUB_TOKEN access).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Joins the tailnet as a temporary tag:ci node and runs scripts/deploy.sh over SSH,
  # one step per stage. Setup: README > Deployment.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: raspberry-pi
    concurrency:
      group: deploy-raspberry-pi
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read # pull on the server, with this job's short-lived token
      id-token: write # Tailscale workload identity federation (no stored Tailscale secret)
    steps:
      - uses: actions/checkout@v7

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$HOST" "$USER" > ~/.ssh/config

      - name: Upload compose file and scripts
        run: |
          tar czf - compose.yaml scripts/deploy.sh scripts/backup.sh \
            | ssh target 'mkdir -p application-tracker && tar xzf - -C application-tracker'

      - name: Pull images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The SHA and actor expand here on purpose: they are the script's arguments.
          # shellcheck disable=SC2029
          printf '%s' "$TOKEN" \
            | ssh target application-tracker/scripts/deploy.sh pull "$GITHUB_SHA" "$GITHUB_ACTOR"

      - name: Back up
        run: ssh target application-tracker/scripts/deploy.sh backup

      - name: Migrate
        run: ssh target application-tracker/scripts/deploy.sh migrate

      - name: Start
        run: ssh target application-tracker/scripts/deploy.sh up

      - name: Health check
        run: ssh target application-tracker/scripts/deploy.sh health

      - name: Remove old images
        run: ssh target application-tracker/scripts/deploy.sh prune

      - if: failure()
        run: ssh target application-tracker/scripts/deploy.sh logs
