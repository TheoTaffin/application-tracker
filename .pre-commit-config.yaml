# Run `make setup` once after cloning, then hooks run on every commit.
# Run all checks manually with `make lint`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig\.json$ # JSONC (comments allowed)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # JS tooling runs through npm scripts so it uses the versions locked in package-lock.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, css, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx eslint --fix --max-warnings=0
        language: system
        types_or: [ts, tsx, javascript]
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
